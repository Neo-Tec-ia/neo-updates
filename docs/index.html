-height:1.05;letter-spacing:-.03em;color:#f2f4f8">Pare de perder tempo no PC. É só falar com o NEO.</h1><p style="margin:0;font-size:20px;line-height:1.6;color:#9aa3b2;max-width:560px">Um assistente de inteligência artificial que mora na tela do seu Windows. Você pede, ele resolve: clima, notícias, dólar, timer e música, na hora, em português.</p><div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><a href="#comprar" style="display:inline-block;background:#b6f23a;color:#0b0c10;font-weight:700;font-size:18px;padding:18px 34px;border-radius:14px;text-decoration:none">Quero o NEO por R$ 74,90</a><span style="font-size:15px;color:#9aa3b2">Pagamento único.<br>Acesso vitalício.</span></div><ul style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:#f2f4f8"><li>✓ Instala em 2 cliques</li><li>✓ Sem mensalidade</li><li>✓ Guia passo a passo</li><li>✓ Suporte no WhatsApp</li></ul></div><div style="flex:1 1 380px;max-width:480px;background:#14161c;border:1px solid #262a33;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.5)"><div style="display:flex;align-items:center;gap:10px;background:#000;border-radius:999px;padding:10px 16px"><span style="width:10px;height:10px;border-radius:50%;background:{{accent}}"></span><span style="font-size:14px;font-weight:600;color:#f2f4f8">NEO · pronto para ajudar</span></div><div style="display:flex;flex-direction:column;gap:10px;min-height:190px"><sc-for list="{{ chat }}" as="m" hint-placeholder-count="2"><div style="align-self:{{m.al}};max-width:86%;background:{{m.bg}};color:{{m.col}};padding:12px 16px;border-radius:16px;font-size:16px;line-height:1.4">{{m.t}}</div></sc-for></div><div style="display:flex;flex-wrap:wrap;gap:8px"><button onClick="{{ c0 }}" style="cursor:pointer;background:#1d2028;color:#f2f4f8;border:1px solid #262a33;border-radius:999px;padding:10px 16px;font-size:15px;font-family:inherit;min-height:44px">clima</button><button onClick="{{ c1 }}" style="cursor:pointer;background:#1d2028;color:#f2f4f8;border:1px solid #262a33;border-radius:999px;padding:10px 16px;font-size:15px;font-family:inherit;min-height:44px">dólar</button><button onClick="{{ c2 }}" style="cursor:pointer;background:#1d2028;color:#f2f4f8;border:1px solid #262a33;border-radius:999px;padding:10px 16px;font-size:15px;font-family:inherit;min-height:44px">timer de 10 minutos</button><button onClick="{{ c3 }}" style="cursor:pointer;background:#1d2028;color:#f2f4f8;border:1px solid #262a33;border-radius:999px;padding:10px 16px;font-size:15px;font-family:inherit;min-height:44px">mude o tema para azul</button></div><span style="font-size:13px;color:#9aa3b2;text-align:center">Experimente: toque num pedido. Simulação ilustrativa.</span></div></div></section><section style="background:#0e1015;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">Quantas vezes por dia você abre o navegador só para saber o básico?</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#9aa3b2;max-width:660px">Clima, notícia, dólar, timer, música. Cada busca é uma aba aberta, um foco perdido e alguns minutos que não voltam. Somando o mês, é muito tempo. O NEO corta isso: você pede e ele responde.</p></div><div style="display:flex;flex-wrap:wrap;gap:20px"><div style="flex:1 1 320px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:28px;box-sizing:border-box"><b style="font-size:13px;color:#9aa3b2;letter-spacing:.08em">SEM O NEO</b><p style="margin:12px 0 0;font-size:18px;line-height:1.6;color:#9aa3b2">Abrir o navegador, procurar o clima, abrir outra aba para o dólar, outra para a música, anotar o timer no celular.</p></div><div style="flex:1 1 320px;background:#10170a;border:1px solid #3b4d14;border-radius:20px;padding:28px;box-sizing:border-box"><b style="font-size:13px;color:#b6f23a;letter-spacing:.08em">COM O NEO</b><p style="margin:12px 0 0;font-size:18px;line-height:1.6;color:#f2f4f8">Você fala “clima”, “dólar” ou “timer de 10 minutos”, e ele resolve na hora, sem você sair do que estava fazendo.</p></div></div></div></section><section style="background:#0b0c10;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div id="demo" style="display:flex;flex-wrap:wrap;gap:48px;align-items:center"><div style="flex:1 1 320px;display:flex;flex-direction:column;gap:18px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">Teste o NEO aqui mesmo</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#9aa3b2">Esta é uma versão de demonstração das telas do NEO. Navegue pelas abas, mude a cor, avance a música e rode um timer.</p><p style="margin:0;font-size:14px;color:#9aa3b2">Demonstração ilustrativa: no NEO de verdade, clima, cotações e música vêm ao vivo.</p></div><div style="flex:1 1 560px;max-width:700px;background:#14161c;border:1px solid #262a33;border-radius:24px;padding:20px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:18px"><div style="display:flex;gap:6px;flex-wrap:wrap;background:#0e1015;border-radius:14px;padding:6px"><button onClick="{{ t0 }}" style="cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{tb0}};color:{{tc0}}">Início</button><button onClick="{{ t1 }}" style="cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{tb1}};color:{{tc1}}">Música</button><button onClick="{{ t2 }}" style="cursor:pointer;border:0;border-radius:10px;padding:10px 1 n</button><button onClick="{{ m25 }}" style="cursor:pointer;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;border:1px solid #262a33;background:{{mb25}};color:{{mc25}}">25 min</button></div><button onClick="{{ startStop }}" style="cursor:pointer;border:0;border-radius:12px;padding:12px 24px;font-size:16px;font-weight:700;font-family:inherit;background:{{accent}};color:#0b0c10;min-height:44px">{{runLabel}}</button><div style="font-size:14px;color:#9aa3b2">No NEO é só dizer “timer de 10 minutos”. Aqui, para testar, escolha o tempo e toque em iniciar.</div></div></div></sc-if><sc-if value="{{ show3 }}" hint-placeholder-val="{{ false }}"><div><div style="font-size:15px;color:#9aa3b2;margin-bottom:12px">Cor de destaque</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button onClick="{{ s0 }}" aria-label="Cor Lima" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#b6f23a;border:{{sb0}}"></button><button onClick="{{ s1 }}" aria-label="Cor Azul" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#3b9eff;border:{{sb1}}"></button><button onClick="{{ s2 }}" aria-label="Cor Lilás" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#a78bfa;border:{{sb2}}"></button><button onClick="{{ s3 }}" aria-label="Cor Âmbar" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#f5a524;border:{{sb3}}"></button><button onClick="{{ s4 }}" aria-label="Cor Laranja" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#d97757;border:{{sb4}}"></button><button onClick="{{ s5 }}" aria-label="Cor Rosa" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#f06bb0;border:{{sb5}}"></button><button onClick="{{ s6 }}" aria-label="Cor Vermelho" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#f4505e;border:{{sb6}}"></button><button onClick="{{ s7 }}" aria-label="Cor Ciano" style="cursor:pointer;width:44px;height:44px;border-radius:50%;background:#22d3ee;border:{{sb7}}"></button></div><div style="font-size:14px;color:#9aa3b2;margin-top:16px">Experimente: a cor do NEO muda na hora. No NEO você também pode pedir por voz: “mude o tema para azul”.</div></div></sc-if></div></div></div></div></section><section id="telas" style="background:#0e1015;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">Veja o NEO por dentro</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#9aa3b2;max-width:660px">Telas reais do programa. Toque nas abas para conhecer cada uma.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button onClick="{{ g0 }}" style="cursor:pointer;border:1px solid #262a33;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{gb0}};color:{{gc0}}">Início</button><button onClick="{{ g1 }}" style="cursor:pointer;border:1px solid #262a33;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{gb1}};color:{{gc1}}">Hábitos</button><button onClick="{{ g2 }}" style="cursor:pointer;border:1px solid #262a33;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{gb2}};color:{{gc2}}">Timers</button><button onClick="{{ g3 }}" style="cursor:pointer;border:1px solid #262a33;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{gb3}};color:{{gc3}}">Rotinas</button><button onClick="{{ g4 }}" style="cursor:pointer;border:1px solid #262a33;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;font-family:inherit;min-height:44px;background:{{gb4}};color:{{gc4}}">Cérebro</button></div><div style="background:#14161c;border:1px solid #262a33;border-radius:28px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-width:980px;width:100%;box-sizing:border-box;align-self:center"><sc-if value="{{ gs0 }}" hint-placeholder-val="{{ true }}"><img src="./img/inicio.webp" alt="Tela Início do NEO" style="width:100%;height:auto;display:block"></sc-if><sc-if value="{{ gs1 }}" hint-placeholder-val="{{ false }}"><img src="./img/habitos.webp" alt="Tela Hábitos do NEO" style="width:100%;height:auto;display:block"></sc-if><sc-if value="{{ gs2 }}" hint-placeholder-val="{{ false }}"><img src="./img/timers.webp" alt="Tela Timers do NEO" style="width:100%;height:auto;display:block"></sc-if><sc-if value="{{ gs3 }}" hint-placeholder-val="{{ false }}"><img src="./img/rotinas.webp" alt="Tela Rotinas do NEO" style="width:100%;height:auto;display:block"></sc-if><sc-if value="{{ gs4 }}" hint-placeholder-val="{{ false }}"><img src="./img/cerebro.webp" alt="Tela Cérebro do NEO" style="width:100%;height:auto;display:block"></sc-if></div><p style="margin:0;text-align:center;font-size:17px;color:#9aa3b2">{{gDesc}}</p></div></section><section id="funcoes" style="background:#0b0c10;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">O que o NEO faz por você</h2></div><div style="display:flex;flex-wrap:wrap;gap:20px"><div style="flex:1 1 240px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box"><span style="font-size:13px;font-weight:700;color:#b6f23a;letter-spacing:.08em">01</span><h3 style="margin:0;font-size:20px;color:#f2f4f8">Fale e ele responde</h3><p style="margin:0;font-size:16px;line-height:1.55;color:#9aa3b2">Converse por voz ar.</p></div><div style="flex:1 1 240px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box"><span style="font-size:13px;font-weight:700;color:#b6f23a;letter-spacing:.08em">06</span><h3 style="margin:0;font-size:20px;color:#f2f4f8">Tarefas e memória</h3><p style="margin:0;font-size:16px;line-height:1.55;color:#9aa3b2">Guarde tarefas e coisas importantes e peça para ele lembrar depois.</p></div><div style="flex:1 1 240px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box"><span style="font-size:13px;font-weight:700;color:#b6f23a;letter-spacing:.08em">07</span><h3 style="margin:0;font-size:20px;color:#f2f4f8">Spotify</h3><p style="margin:0;font-size:16px;line-height:1.55;color:#9aa3b2">Controle a música pelo NEO e veja a barrinha de tempo. Precisa de Spotify Premium.</p></div><div style="flex:1 1 240px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box"><span style="font-size:13px;font-weight:700;color:#b6f23a;letter-spacing:.08em">08</span><h3 style="margin:0;font-size:20px;color:#f2f4f8">Do seu jeito</h3><p style="margin:0;font-size:16px;line-height:1.55;color:#9aa3b2">Troque cores, tema e personagem. Até por voz: “mude o tema para azul”.</p></div></div></div></section><section id="personagens" style="background:#0e1015;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">Escolha quem vai morar na sua tela</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#9aa3b2;max-width:660px">São 12 personagens, e você ainda troca a cor dos olhos e os acessórios. Toque  style="margin:0;font-size:17px;line-height:1.55;color:#9aa3b2">{{selDesc}}</p></div></div></section><section id="como" style="background:#0b0c10;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">Pronto para usar em 5 minutos</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#9aa3b2;max-width:660px">Você não precisa saber nada de computador. O NEO tem um guia dentro dele que leva você pela mão.</p></div><div style="display:flex;flex-wrap:wrap;gap:36px"><div style="flex:1 1 280px;display:flex;flex-direction:column;gap:12px"><span style="width:44px;height:44px;border-radius:50%;background:#b6f23a;color:#0b0c10;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center">1</span><h3 style="margin:0;font-size:22px;color:#f2f4f8">Compre e receba</h3><p style="margin:0;font-size:16px;line-height:1.6;color:#9aa3b2">Pague pelo Mercado Pago e chame no WhatsApp. Você recebe o instalador e a sua chave de ativação.</p></div><div style="flex:1 1 280px;display:flex;flex-direction:column;gap:12px"><span style="width:44px;height:44px;border-radius:50%;background:#b6f23a;color:#0b0c10;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center">2</span><h3 style="margin:0;font-size:22px;color:#f2f4f8">Instale e siga o guia</h3><p style="margin:0;font-size:16px;line-height:1.6;color:#9aa3b2">Dois cliques para instalar. Depois, o guia pede seu nome, a sua cidade e a chave gratuita do Google Gemini, que é o cérebro do NEO.</p></div><div style="flex:1 1 280px;display:flex;flex-direction:column;gap:12px"><span style="width:44px;height:44px;border-radius:50%;background:#b6f23a;color:#0b0c10;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center">3</span><h3 style="margin:0;font-size:22px;color:#f2f4f8">Comece a conversar</h3><p style="margin:0;font-size:16px;line-height:1.6;color:#9aa3b2">Toque em falar ou escreva um pedido. Pronto: o NEO já está trabalhando para você.</p></div></div></div></section><section id="estado" style="background:#0e1015;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">O que já funciona e o que ainda vem</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#9aa3b2;max-width:660px">Aqui está o que o NEO faz hoje, sem enrolação.</p></div><div style="display:flex;flex-wrap:wrap;gap:20px"><div style="flex:1 1 280px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;box-sizing:border-box"><b style="font-size:18px;color:#b6f23a">Funciona hoje</b><ul style="margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#9aa3b2;font-size:16px;line-height:1.5"><li>Conversa por voz e por texto</li><li>Clima da cidade que você escolher</li><li>Notícias, dólar e Bitcoin</li><li>Timers e tarefas</li><li>Spotify (com Premium)</li><li>Temas, cores e 12 personagens</li></ul></div><div style="flex:1 1 280px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;box-sizing:border-box"><b style="font-size:18px;color:#f5a524">Em teste</b><ul style="margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#9aa3b2;font-size:16px;line-height:1.5"><li>Agenda</li><li>Memória de longo prazo</li><li>Novas vozes</li></ul></div><div style="flex:1 1 280px;background:#14161c;border:1px solid #262a33;border-radius:20px;padding:26px;box-sizing:border-box"><b style="font-size:18px;color:#9aa3b2">Ainda não</b><ul style="margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#9aa3b2;font-size:16px;line-height:1.5"><li>Câmeras IP</li><li>Vendas e dados do PDV da loja</li><li>Mac e celular</li></ul></div></div></div></section><section style="background:#0b0c10;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.02em;color:#f2f4f8">Transparente desde o começo</h2></div><div style="display:flex;flex-wrap:wrap;gap:28px"><div style="flex:1 1 240px;border-left:3px solid #b6f23a;padding:4px 0 4px 18px"><b style="font-size:18px;color:#f2f4f8">Seus dados ficam no seu PC</b><p style="margin:6px 0 0;font-size:16px;line-height:1.55;color:#9aa3b2">Suas chaves, tarefas e memórias são guardadas no seu computador.</p></div><div style="flex:1 1 240px;border-left:3px solid #b6f23a;padding:4px 0 4px 18px"><b style="font-size:18px;color:#f2f4f8">Sem mensalidade</b><p style="margin:6px 0 0;font-size:16px;line-height:1.55;color:#9aa3b2">Você paga uma vez e usa o NEO que comprou, sem renovação.</p></div><div style="flex:1 1 240px;border-left:3px solid #b6f23a;padding:4px 0 4px 18px"><b style="font-size:18px;color:#f2f4f8">Usa a sua chave do Gemini</b><p style="margin:6px 0 0;font-size:16px;line-height:1.55;color:#9aa3b2">O Gemini tem plano gratuito do Google, com limites de uso definidos por eles.</p></div><div style="flex:1 1 240px;border-left:3px solid #b6f23a;padding:4px 0 4px 18px"><b style="font-size:18px;color:#f2f4f8">Feito para Windows</b><p style="margin:6px 0 0;font-size:16px;line-height:1.55;color:#9aa3b2">Funciona no Windows 10 e 11, com internet. Spotify exige conta Premium.</p></div></div></div></section><section style="background:#0e1015;padding:88px 24px;box-sizing:border-box"><div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><h2 s const s=this.state,AC=s.accent,TXT='#f2f4f8',MUT='#9aa3b2',DK='#0b0c10';
const ask=(q,r,ac)=>()=>this.setState({chat:[...this.state.chat,{w:'v',t:q},{w:'n',t:r}].slice(-6),...(ac?{accent:ac}:{})});
const v={accent:AC};
v.chat=s.chat.map(m=>({t:m.t,al:m.w==='v'?'flex-end':'flex-start',bg:m.w==='v'?AC:'#1d2028',col:m.w==='v'?DK:TXT}));
v.c0=ask('clima','Aqui está o clima da sua cidade, com temperatura e previsão.');
v.c1=ask('dólar','Mostro o dólar e o Bitcoin ao vivo, direto na tela inicial.');
v.c2=ask('timer de 10 minutos','Timer de 10 minutos iniciado.');
v.c3=ask('mude o tema para azul','Pronto! Troquei o tema para azul.','#3b9eff');
for(let i=0;i<4;i++){v['t'+i]=()=>this.setState({tab:i});v['show'+i]=s.tab===i;v['tb'+i]=s.tab===i?AC:'transparent';v['tc'+i]=s.tab===i?DK:MUT;}
v.togglePlay=()=>this.setState({playing:!this.state.playing});v.playLabel=s.playing?'II':'▶';
const sec=Math.round(210*s.pos/100);v.posTxt=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');v.pos=Math.round(s.pos);
v.setPos=(e)=>this.setState({pos:Number(e.target.value)||0});
[1,5,10,25].forEach(m=>{v['m'+m]=()=>this.setState({mins:m,left:m*60,running:false});v['mb'+m]=s.mins===m?AC:'transparent';v['mc'+m]=s.mins===m?DK:TXT;});
v.clock=String(Math.floor(s.left/60)).padStart(2,'0')+':'+String(s.left%60).padStart(2,'0');
v.startStop=()=>this.setState({running:!this.state.running,left:this.state.running?this.state.left:(this.state.left>0?this.state.left:this.state.mins*60)});v.runLabel=s.running?'Pausar':'Iniciar';
const cols=['#b6f23a','#3b9eff','#a78bfa','#f5a524','#d97757','#f06bb0','#f4505e','#22d3ee'];
cols.forEach((c,i)=>{v['s'+i]=()=>this.setState({accent:c});v['sb'+i]=AC===c?'3px solid #f2f4f8':'3px solid transparent';});
const CH=[{"nome": "Neo", "tag": "Clássico", "desc": "O robô original. Alegre e sempre pronto.", "eyes": "#b6f23a"}, {"nome": "Shade", "tag": "Misterioso", "desc": "Discreto, calmo e um pouco misterioso.", "eyes": "#a78bfa"}, {"nome": "Mimo", "tag": "Divertido", "desc": "Um companheiro curioso e expressivo.", "eyes": "#7dd3fc"}, {"nome": "Orbit", "tag": "Explorador", "desc": "Explorador do universo e das ideias.", "eyes": "#3b9eff"}, {"nome": "Ronin", "tag": "Focado", "desc": "Focado, silencioso e observador.", "eyes": "#ff6b5b"}, {"nome": "Aura", "tag": "Tranquilo", "desc": "Gentil, sereno e acolhedor.", "eyes": "#a78bfa"}, {"nome": "Vex", "tag": "Travesso", "desc": "O mais irreverente da turma.", "eyes": "#f06bb0"}, {"nome": "Flora", "tag": "Natural", "desc": "Curiosa e cheia de vida.", "eyes": "#34d399"}, {"nome": "Fox", "tag": "Criativo", "desc": "Criativo, rápido e inteligente.", "eyes": "#fff1c9"}, {"nome": "Broto", "tag": "Amigável", "desc": "Leve, pequeno e otimista.", "eyes": "#b6f23a"}, {"nome": "Ghost", "tag": "Leve", "desc": "Um espírito bem-humorado e leve.", "eyes": "#8fa0ff"}, {"nome": "Pingo", "tag": "Fofo", "desc": "Acolhedor, divertido e leal.", "eyes": "#eceef1"}];
CH.forEach((c,i)=>{v['p'+i]=()=>this.setState({sel:i});v['pb'+i]=s.sel===i?'2px solid '+c.eyes:'2px solid #262a33';});
v.selNome=CH[s.sel].nome;v.selTag=CH[s.sel].tag;v.selDesc=CH[s.sel].desc;
for(let i=0;i<8;i++){v['f'+i]=()=>this.setState({faq:this.state.faq===i?-1:i});v['fo'+i]=s.faq===i;v['fx'+i]=s.faq===i?'true':'false';v['fm'+i]=s.faq===i?'–':'+';}
v.ck1=s.ck===1;v.ck2=s.ck===2;v.ck3=s.ck===3;
[1,2,3].forEach(n=>{v['pc'+n]=s.ck===n?AC:'#9aa3b2';});
v.nome=s.nome;v.email=s.email;v.cel=s.cel;v.erro=!!s.erro;v.erroTxt=s.erro;
v.onNome=(e)=>{this.state.nome=e.target.value;};v.onEmail=(e)=>{this.state.email=e.target.value;};v.onCel=(e)=>{this.state.cel=e.target.value;};
v.irPasso2=()=>{const st=this.state;const dg=st.cel.replace(/\D/g,'');
if(st.nome.trim().length<3){this.setState({erro:'Digite seu nome completo.'});return;}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email.trim())){this.setState({erro:'Digite um e-mail válido.'});return;}
if(dg.length<10||dg.length>13){this.setState({erro:'Digite o WhatsApp com DDD.'});return;}
this.setState({erro:'',ck:2});};
v.irPasso3=()=>this.setState({ck:3});v.voltar1=()=>this.setState({ck:1});v.voltar2=()=>this.setState({ck:2});
v.waLink='https://wa.me/5534998667111?text='+encodeURIComponent('Olá! Já paguei o NEO (R$ 74,90).\nNome: '+s.nome.trim()+'\nE-mail: '+s.email.trim()+'\nWhatsApp: '+s.cel.trim()+'\nPEDIDO DE CHAVE DE ATIVAÇÃO');
v.dkOpen=s.dk;v.dkExp=s.dk?'true':'false';v.dkDica=!s.dk;v.dkSeta=s.dk?'▴':'▾';v.dkBorda=s.dk?'2px solid '+AC:'1px solid #262a33';v.dkToggle=()=>this.setState({dk:!this.state.dk});
for(let i=0;i<6;i++){v['dt'+i]=()=>this.setState({dt:i});v['ds'+i]=s.dt===i;v['db'+i]=s.dt===i?AC:'transparent';v['dc'+i]=s.dt===i?DK:TXT;}
v.tasks=s.tasks.map((k,i)=>({t:k.t,go:()=>{const a=this.state.tasks.slice();a[i]={t:a[i].t,d:!a[i].d};this.setState({tasks:a});},mk:k.d?'✓':'',bg:k.d?AC:'transparent',col:k.d?MUT:TXT,dec:k.d?'line-through':'none'}));
v.nPend=s.tasks.filter(k=>!k.d).length;v.newT=s.newT;v.onNewT=(e)=>this.setState({newT:e.target.value});
v.addT=()=>{const t=this.state.newT.trim().slice(0,60);if(!t)return;this.setState({tasks:[...this.state.tasks,{t:t,d:false}].slice(-8),newT:''});};
v.tClock=String(Math.floor(s.tleft/60)).padStart(2,'0')+':'+String(s.tleft%60).padStart(2,'0');v.tRun=s.trun?'Pausar':'Iniciar';
[5,10,25].forEach(m=>{v['tm'+m]=()=>this.setState({tm:m,tleft:m*60,trun:false});});
v.tStart=()=>this.setState({trun:!this.state.trun,tleft:this.state.tleft>0?this.state.tleft:this.state.tm*60});
CH.forEach((c,i)=>{v['q'+i]=()=>this.setState({av:i});v['qb'+i]=s.av===i?'2px solid '+c.eyes:'2px solid #262a33';v['av'+i]=s.av===i;});
v.avNome=CH[s.av].nome;v.avDesc=CH[s.av].desc;
v.models=s.models.map((m,i)=>({t:m,go:()=>this.setState({md:i}),bd:s.md===i?'2px solid '+AC:'1px solid #262a33'}));
v.newM=s.newM;v.onNewM=(e)=>this.setState({newM:e.target.value});
v.addM=()=>{const t=this.state.newM.trim().slice(0,30);if(!t)return;this.setState({models:[...this.state.models,t].slice(-6),md:Math.min(this.state.models.length,5),newM:''});};
const GD=["Sua tela inicial: saudação, cotações, música e o campo para dar comandos.", "Acompanhe seus hábitos do dia, um de cada vez.", "Timers com contagem regressiva, prontos em um toque.", "Sequências de ações com um clique: bom dia, foco total, boa noite.", "Você escolhe qual inteligência artificial o NEO usa, grátis ou paga."];
for(let i=0;i<5;i++){v['g'+i]=()=>this.setState({gal:i});v['gs'+i]=s.gal===i;v['gb'+i]=s.gal===i?AC:'transparent';v['gc'+i]=s.gal===i?DK:TXT;}
v.gDesc=GD[s.gal];
return v;}
}
